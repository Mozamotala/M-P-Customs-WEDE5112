<body>
    <header id="top">
      <br>
      <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
      </nav>
        <br>  
    </header>
    
<main>
    <h1>
        Want a quote fill this out  
    </h1>
    <form>
        <fieldset>
            <legend> Enquiries </legend>
            <div>
                <label>
                    Name
                </label>
                <input type="text" id="name" name="name" required><br><br>
            </div>
            <div>
                <label>
                    Email
                </label>
                <input type="email" id="email" name="email" required><br><br>
            </div>
            <div>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="123-456-7890"><br><br>
            </div>
            <div>
                <label for="services">Services needed</label>
                <select id="services" name="services">
                <option value="Deselected">Select service </option>
                <option value="3D printing">3D printing</option>
                <option value="CNC">CNC</option>
                <option value="Welding">Welding</option>
            </select>
            </div>
         
            <div>
            <label for="feedback">Feedback:</label><br>
                        <textarea id="feedback" name="feedback" rows="4" cols="50" required></textarea><br><br>
                        <input type="submit" value="Submit">
            </div>

        </fieldset>

    </form>
    
</main>
