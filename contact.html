<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact M&P Customs</title>
    <meta name="author" content="Mohamed Zaeem Motala">
    <meta name="keywords" content="3D-printing,welding,CNC">
    <meta name="description" content="Contact M&P Customs">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://www.google.com">
    <link rel="preconnect" href="https://maps.googleapis.com">
</head>
<body>
    <!-- main header and navbar -->
    <header id="top">
        <img src="images/M&P-logo.jpg" alt="M&P Customs Logo" width="100" height="100" class="logo">
        <h1>
            Contact Us
        </h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <main>
            <h2 id="Contact-Form">
                Want to contact us fill in the form below
            </h2>
            <h2>
                This form is to email us
            </h2>
            <!-- contact form so people can email us directly -->
            <div class="form-container">
                <form>
                    <fieldset>
                        <legend> Contact us </legend>
                        <div>
                            <label for="name">
                                Name
                            </label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div>
                            <label for="email">
                                Email
                            </label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div>
                            <label for="phone">Phone Number:</label>
                            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="1234567890">
                        </div>
                        <div>
                            <label for="feedback">Feedback:</label>
                            <textarea id="feedback" name="feedback" rows="4" cols="50" required></textarea>
                            <input type="submit" value="Submit">
                        </div>
                    </fieldset>
                </form>
            </div>
            <h2>
                Where to Find us
            </h2>
            <div class="map-container">
                <!-- google maps embed showing our workshop location -->
                <iframe
                    src="https://www.google.com/maps/d/u/0/embed?mid=1pia3fwbkqTUZsUVl3d2pEByEDmAcc-8&ehbc=2E312F"
                    width="100%"
                    height="480"
                    loading="lazy"
                    allowfullscreen=""
                >
                </iframe>
            </div>
            <!-- social links and direct contact details -->
            <h2>
                Find Us On
            </h2>
            <div id="contact-info" class="contact-info">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"> <!--rel="noopener noreferrer" used for protection to prevent website hijacking-->
                    <img src="images/svg/instagram-svgrepo-com.svg" width="50" height="50" alt="Instagram">
                    <h3>Instagram</h3>
                </a>

                <a href="tel:+27615365750">
                    <img src="images/svg/phone-svgrepo-com.svg" width="50" height="50" alt="Phone">
                    <h3>Call Us</h3>
                    <p>0615365750</p>
                </a>

                <a href="#Contact-Form">
                    <img src="images/svg/mail-alt-svgrepo-com.svg" width="50" height="50" alt="Email">
                    <h3>Email</h3>
                </a>

                <a href="https://wa.me/15551234567" target="_blank" rel="noopener noreferrer">
                    <img src="images/svg/whatsapp.svg" width="50" height="50" alt="WhatsApp">
                    <h3>WhatsApp</h3>
                </a>
            </div>
        </main>
    </div>
    <!-- footer with back to top link and copyright -->
    <footer>
        <a href="#top">Back to top</a>
        <p>&copy; 2026 M&amp;P Customs. All rights reserved.</p>
    </footer>
</body>
</html>
